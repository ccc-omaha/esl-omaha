<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}" class="s-{{SCRIPT_CLASS}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{CANONICAL}}">
  {{HREFLANG}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#FFFBF4">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="https://use.typekit.net/ohw6ayv.css">
  {{FONTS}}
  <style>
    :root{
      --ink:#101935; --ink-2:#3b4462; --line:#e6dfd3;
      --paper:#FFFBF4; --cream:#FBEFDA; --aqua:#8DE2E0; --aqua-soft:#E3F7F6;
      --mint:#CCF5DC; --mint-soft:#ECFBF2; --peach:#FFE3CC; --orange:#FF8017; --orange-ink:#9A4300;
      --blue:#0067B3; --error:#B3261E;
      --font:"proxima-nova",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      --radius:22px; --wrap:1180px;
    }
    .s-arabic{--font:"Vazirmatn","proxima-nova",Tahoma,Arial,sans-serif}
    .s-cjk{--font:"proxima-nova","PingFang SC","Hiragino Sans GB","Apple SD Gothic Neo","Noto Sans SC","Noto Sans KR","Malgun Gothic","Microsoft YaHei",sans-serif}
    .s-indic{--font:"Noto Sans Telugu","Noto Sans Devanagari","proxima-nova",sans-serif}
    .s-indic body{line-height:1.75}
    .s-indic h1,.s-indic h2,.s-indic h3{letter-spacing:0;line-height:1.35}
    .s-indic .eyebrow,.s-indic .class-name{letter-spacing:0;font-size:.95rem}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased}
    .s-arabic body{font-size:19px;line-height:1.85}
    img{max-width:100%;display:block}
    a{color:inherit}
    h1,h2,h3{line-height:1.1;margin:0;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
    .s-arabic h1,.s-arabic h2,.s-arabic h3{letter-spacing:0;line-height:1.35}
    p,li,summary,dd{text-wrap:pretty}
    h2{font-size:clamp(2rem,4.2vw,3.1rem)}
    .wrap{width:min(var(--wrap),100% - 2.5rem);margin-inline:auto}
    .narrow{width:min(820px,100% - 2.5rem)}
    .skip{position:absolute;inset-inline-start:1rem;top:-4rem;background:var(--ink);color:#fff;padding:.6rem 1rem;border-radius:10px;z-index:99}
    .skip:focus{top:1rem}
    :focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
    .i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.18em}
    .eyebrow{font-size:.82rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-ink);margin:0 0 .8rem}
    .s-arabic .eyebrow,.s-cjk .eyebrow{letter-spacing:0;font-size:.95rem}
    .head{max-width:680px;margin-bottom:2.6rem}
    .head p:last-child{color:var(--ink-2);margin:1rem 0 0;font-size:1.1rem}
    .head.center{text-align:center;margin-inline:auto}

    /* buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:inherit;font-weight:700;font-size:1rem;line-height:1.2;text-decoration:none;border-radius:999px;padding:.85rem 1.5rem;border:2px solid var(--ink);cursor:pointer;transition:background .2s,color .2s,transform .2s}
    .btn-dark{background:var(--ink);color:#fff}
    .btn-dark:hover{background:#26305a;border-color:#26305a}
    .btn-line{background:transparent;color:var(--ink)}
    .btn-line:hover{background:var(--ink);color:#fff}
    .btn-lg{padding:1.05rem 1.9rem;font-size:1.08rem}
    .btn-sm{padding:.55rem 1.1rem;font-size:.92rem}
    .btn-link{background:none;border:0;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;color:var(--ink);padding:.5rem}

    /* language bar */
    .langbar{background:var(--aqua);font-size:.95rem}
    .langbar .wrap{display:flex;align-items:center;gap:1rem;min-height:48px}
    .lb-label{display:inline-flex;align-items:center;gap:.45rem;font-weight:800;white-space:nowrap}
    .lb-list{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;padding:.4rem 0;mask-image:linear-gradient(to right,#000 92%,transparent)}
    [dir=rtl] .lb-list{mask-image:linear-gradient(to left,#000 92%,transparent)}
    .lb-list::-webkit-scrollbar{display:none}
    .lb-list a,.lb-more{flex:none;text-decoration:none;padding:.3rem .8rem;border-radius:999px;font-weight:600;white-space:nowrap;background:none;border:0;font:inherit;font-weight:600;color:var(--ink);cursor:pointer}
    .lb-list a:hover,.lb-more:hover{background:rgba(255,255,255,.55)}
    .lb-list a[aria-current]{background:#fff;font-weight:800}
    .lb-list [lang=fa-AF],.lb-list [lang=ps],.lb-list [lang=ar]{font-family:"Vazirmatn",Tahoma,sans-serif}

    /* header */
    .top{position:sticky;top:0;z-index:20;background:rgba(255,251,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
    .top.scrolled{border-bottom-color:var(--line)}
    .top .wrap{display:flex;align-items:center;gap:1.4rem;height:78px}
    .logo{display:block;color:var(--ink);flex:none}
    .logo svg{height:44px;width:auto;display:block}
    .top nav{display:flex;gap:1.6rem;margin-inline-start:auto}
    .top nav a{text-decoration:none;font-weight:600}
    .top nav a:hover{text-decoration:underline;text-underline-offset:5px}
    .lang-btn{display:inline-flex;align-items:center;gap:.45rem;font:inherit;font-weight:700;font-size:.95rem;background:var(--aqua-soft);border:2px solid var(--aqua);color:var(--ink);border-radius:999px;padding:.5rem .95rem;cursor:pointer}
    .lang-btn:hover{background:var(--aqua)}

    /* Google in-page translation: hide Google's own bar and highlights */
    .skiptranslate iframe,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame{display:none!important}
    body{top:0!important}
    .goog-text-highlight{background:none!important;box-shadow:none!important}
    .gt-note{background:var(--ink);color:#fff;font-size:.92rem}
    .gt-note .wrap{display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between;padding:.55rem 0}
    .gt-note p{margin:0}
    .gt-note a{color:#fff;font-weight:700}

    /* language suggestion */
    .suggest{background:var(--ink);color:#fff}
    .suggest .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1rem;padding:.8rem 0}
    .suggest p{margin:0;font-weight:700;font-size:1.05rem}
    .suggest .btn-dark{background:#fff;color:var(--ink);border-color:#fff}
    .suggest .btn-link{color:#fff}

    /* hero */
    .hero{padding:clamp(2.5rem,6vw,5rem) 0 clamp(2rem,4vw,3.5rem)}
    .hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(2rem,5vw,4.5rem);align-items:center}
    .pill{display:inline-block;background:var(--peach);color:var(--orange-ink);font-weight:800;border-radius:999px;padding:.35rem 1rem;margin:0 0 1.4rem;font-size:.98rem}
    .hero h1{font-size:clamp(2.6rem,5.6vw,4.4rem);letter-spacing:-.025em}
    .s-arabic .hero h1{letter-spacing:0}
    .lede{font-size:clamp(1.12rem,1.6vw,1.3rem);color:var(--ink-2);margin:1.4rem 0 2.1rem;max-width:34em}
    .actions{display:flex;flex-wrap:wrap;gap:.8rem}
    .hero-photo{margin:0 0 46px;position:relative}
    .bubble{position:relative;border-radius:46% 54% 50% 50% / 50% 46% 54% 50%;border-radius:40px 40px 40px 40px;overflow:hidden;aspect-ratio:1.18;box-shadow:0 0 0 10px var(--paper),0 0 0 13px var(--ink)}
    .bubble img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
    .tail{position:absolute;top:calc(100% + 10px);inset-inline-start:13%;width:64px;height:46px;overflow:visible;z-index:2}
    [dir=rtl] .tail{transform:scaleX(-1)}

    /* greetings */
    .hello{padding:2.6rem 0 1.4rem;overflow:hidden}
    .hello .wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.4rem 1.1rem;font-size:clamp(1.05rem,1.8vw,1.35rem);font-weight:700;color:var(--ink-2)}
    .hello [lang=fa-AF],.hello [lang=ps],.hello [lang=ar]{font-family:"Vazirmatn",Tahoma,sans-serif}
    .hello .dot{width:7px;height:7px;border-radius:50%;background:var(--orange)}
    .hello .dot:nth-of-type(3n+2){background:var(--aqua)}
    .hello .dot:nth-of-type(3n){background:#7fd8a3}

    /* facts */
    .facts{padding:1.5rem 0 clamp(3rem,6vw,5rem)}
    .facts .wrap{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
    .fact{padding:1.6rem 1.4rem 0 0}
    [dir=rtl] .fact{padding:1.6rem 0 0 1.4rem}
    .fact-title{font-size:clamp(1.5rem,2.4vw,1.95rem);font-weight:800;margin:0 0 .35rem;line-height:1.15}
    .fact p:last-child{margin:0;color:var(--ink-2);font-size:1.02rem}

    /* classes */
    .classes{padding:clamp(4rem,8vw,6.5rem) 0;background:#fff;border-block:1px solid var(--line)}
    .class-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem}
    .class-card{border-radius:var(--radius);padding:clamp(1.6rem,3vw,2.4rem);display:flex;flex-direction:column}
    .tone-aqua{background:var(--aqua-soft)}
    .tone-peach{background:#FFF1E4}
    .class-name{font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;margin:0 0 .5rem;color:var(--ink-2)}
    .s-arabic .class-name,.s-cjk .class-name{letter-spacing:0;font-size:.95rem}
    .class-card h3{font-size:clamp(2.1rem,3.6vw,2.8rem)}
    .class-time{font-size:1.45rem;font-weight:700;margin:.3rem 0 1.4rem}
    dl{margin:0 0 1.8rem;display:grid;gap:.85rem}
    dl div{display:grid;grid-template-columns:8.5rem 1fr;gap:.8rem;align-items:baseline;border-top:1px solid rgba(16,25,53,.12);padding-top:.85rem}
    dt{font-weight:700;display:flex;gap:.5rem;align-items:center;font-size:.95rem}
    dd{margin:0}
    .dir-link{font-weight:600;font-size:.92rem;white-space:nowrap}
    .class-card .btn{margin-top:auto;align-self:flex-start}
    .bible{margin-top:1.6rem;border:2px solid var(--ink);border-radius:var(--radius);padding:clamp(1.5rem,3vw,2.2rem);display:grid;grid-template-columns:1.1fr 1.2fr auto;gap:1.5rem 2.4rem;align-items:center}
    .bible h3{font-size:1.65rem;margin-bottom:.4rem}
    .bible p{margin:0}
    .bible dl{margin:0}
    .bible dl div{grid-template-columns:6.5rem 1fr}

    /* expect */
    .expect{padding:clamp(4rem,8vw,6.5rem) 0}
    .steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:2rem;counter-reset:s}
    .steps li{counter-increment:s;position:relative;padding-top:4.6rem}
    .steps li::before{content:counter(s);position:absolute;top:0;inset-inline-start:0;width:3.4rem;height:3.4rem;border-radius:50% 50% 50% 8px;display:grid;place-items:center;font-size:1.5rem;font-weight:800;background:var(--mint)}
    [dir=rtl] .steps li::before{border-radius:50% 50% 8px 50%}
    .steps li:nth-child(2)::before{background:var(--aqua)}
    .steps li:nth-child(3)::before{background:var(--peach)}
    .steps h3{font-size:1.45rem;margin-bottom:.5rem}
    .steps p{margin:0;color:var(--ink-2)}

    /* faq */
    .faq{padding:clamp(4rem,8vw,6.5rem) 0;background:var(--cream)}
    .split{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(2rem,5vw,4.5rem);align-items:start}
    .faq-list details{border-bottom:1px solid rgba(16,25,53,.18)}
    .faq-list details:first-child{border-top:1px solid rgba(16,25,53,.18)}
    .faq-list summary{cursor:pointer;list-style:none;font-weight:700;font-size:1.22rem;padding:1.25rem 2.5rem 1.25rem 0;position:relative}
    [dir=rtl] .faq-list summary{padding:1.25rem 0 1.25rem 2.5rem}
    .faq-list summary::-webkit-details-marker{display:none}
    .faq-list summary::after{content:"";position:absolute;inset-inline-end:.3rem;top:50%;width:14px;height:14px;margin-top:-10px;border-right:2.5px solid;border-bottom:2.5px solid;transform:rotate(45deg);transition:transform .2s}
    .faq-list details[open] summary::after{transform:rotate(-135deg);margin-top:-3px}
    .faq-list details p{margin:0 0 1.4rem;color:var(--ink-2);max-width:38em}

    /* forms */
    .register{padding:clamp(4rem,8vw,6.5rem) 0;background:var(--mint-soft)}
    .panel{background:#fff;border-radius:var(--radius);padding:clamp(1.4rem,4vw,2.8rem);border:1px solid var(--line)}
    .form{display:grid;gap:1.35rem}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
    .row.three{grid-template-columns:1.3fr 1fr 1fr}
    .field{margin:0;padding:0;border:0;min-width:0}
    .field label,.field legend{display:block;font-weight:700;margin-bottom:.4rem;font-size:1rem;padding:0}
    .req,.opt{font-weight:500;font-size:.8rem;color:var(--ink-2);margin-inline-start:.3rem}
    .req{color:var(--orange-ink)}
    .help{margin:-.2rem 0 .45rem;font-size:.92rem;color:var(--ink-2)}
    input:not([type=radio]):not([type=checkbox]),select,textarea{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:#fff;border:2px solid #cfc8bb;border-radius:12px;padding:.75rem .9rem;transition:border-color .15s}
    textarea{resize:vertical}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,103,179,.18)}
    .dob label span{display:block;font-size:.88rem;font-weight:600;margin-bottom:.3rem;color:var(--ink-2)}
    .address{display:grid;gap:1rem}
    .address legend{margin-bottom:.2rem}
    .address .field label{font-weight:600;font-size:.92rem;color:var(--ink-2)}
    .opts{display:flex;flex-wrap:wrap;gap:.6rem}
    .field .opt-item{display:inline-flex!important;align-items:center;gap:.6rem;font-weight:600!important;border:2px solid #cfc8bb;border-radius:14px;padding:.6rem 1rem .6rem .8rem;cursor:pointer;margin:0!important;background:#fff;transition:border-color .15s,background .15s}
    [dir=rtl] .field .opt-item{padding:.6rem .8rem .6rem 1rem}
    .opt-item:hover{border-color:var(--ink)}
    .opt-item:has(input:checked){border-color:var(--ink);background:var(--aqua-soft)}
    .opt-item input{width:1.25rem;height:1.25rem;accent-color:var(--ink);margin:0}
    .class-pick .opts{display:grid;grid-template-columns:1fr 1fr}
    .field.class-pick .opt-item{padding:1rem 1.1rem;font-size:1.05rem}
    .follow{display:grid;gap:1.35rem}
    .follow[hidden],[hidden]{display:none!important}
    .err{margin:.4rem 0 0;color:var(--error);font-weight:600;font-size:.92rem}
    .invalid input:not([type=radio]):not([type=checkbox]),.invalid select,.invalid textarea,input.bad,select.bad{border-color:var(--error)}
    .invalid .opt-item{border-color:#e3a7a2}
    .form-error{background:#FCE8E6;color:var(--error);padding:.8rem 1rem;border-radius:12px;font-weight:600;margin:0}
    .privacy{font-size:.9rem;color:var(--ink-2);margin:0}
    .form .btn{justify-self:start}
    .form-success{text-align:center;padding:2rem 1rem}
    .form-success .i{width:3.4rem;height:3.4rem;stroke-width:2.2;color:#127a3e;background:var(--mint);border-radius:50%;padding:.7rem;margin:0 auto 1rem;display:block}
    .form-success p{font-size:1.25rem;font-weight:700;margin:0 auto;max-width:28em}
    .hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0}

    /* contact */
    .contact{padding:clamp(4rem,8vw,6.5rem) 0}
    .contact-intro p:not(.eyebrow){color:var(--ink-2);font-size:1.1rem}
    .person{display:flex;align-items:center;gap:1.1rem;margin-top:2rem}
    .person img{width:104px;height:104px;border-radius:50% 50% 50% 10px;object-fit:cover;object-position:50% 20%}
    [dir=rtl] .person img{border-radius:50% 50% 10px 50%}
    .person p{margin:0;display:flex;flex-direction:column;line-height:1.35;color:var(--ink)!important}
    .person span{color:var(--ink-2);font-size:1rem}

    /* footer */
    footer{background:var(--ink);color:#fff;padding:4rem 0 1.5rem}
    footer .wrap{display:grid;grid-template-columns:1fr 1.2fr;gap:3rem}
    footer .logo{color:#fff;margin-bottom:1.2rem}
    footer .logo svg{height:52px}
    footer p{margin:.2rem 0;color:#d5d9e6}
    .fb{display:inline-flex;align-items:center;gap:.5rem;margin-top:1.2rem;font-weight:700;color:#fff;text-decoration:none;border:2px solid rgba(255,255,255,.4);border-radius:999px;padding:.55rem 1.1rem}
    .fb:hover{border-color:#fff}
    .f-langs p{font-weight:800;color:#fff;display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem}
    .f-langs div{display:flex;flex-wrap:wrap;gap:.4rem}
    .f-langs a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:.3rem .85rem;font-size:.95rem}
    .f-langs a:hover,.f-langs a[aria-current]{background:#fff;color:var(--ink)}
    .copy{text-align:center;font-size:.85rem;color:#9aa3bd!important;margin-top:3rem!important}

    /* language dialog */
    .lang-dialog{border:0;border-radius:var(--radius);padding:clamp(1.3rem,3vw,2.2rem);width:min(760px,calc(100% - 1.5rem));max-height:calc(100dvh - 2rem);color:var(--ink);background:var(--paper)}
    .lang-dialog::backdrop{background:rgba(16,25,53,.55)}
    .ld-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.2rem}
    .ld-head h2{font-size:1.6rem;display:flex;gap:.55rem;align-items:center}
    .ld-close{background:none;border:0;cursor:pointer;padding:.4rem;color:var(--ink)}
    .ld-close .i{width:1.6rem;height:1.6rem}
    .ld-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.55rem}
    .ld-lang,.more-lang{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;font:inherit;font-weight:700;font-size:1.12rem;background:#fff;border:2px solid var(--line);border-radius:14px;padding:.75rem 1rem;color:var(--ink);cursor:pointer;text-align:start}
    .ld-lang:hover,.more-lang:hover{border-color:var(--ink)}
    .ld-lang[aria-current]{border-color:var(--ink);background:var(--aqua-soft)}
    .more-lang{font-size:1rem}
    .more-lang small{font-weight:500;font-size:.8rem;color:var(--ink-2);font-family:var(--font)}
    .lang-dialog h3{margin:1.8rem 0 .2rem;font-size:1.2rem}
    .ld-note{margin:0 0 .8rem;font-size:.92rem;color:var(--ink-2)}

    @media (max-width:980px){
      .top nav{display:none}
      .lang-btn{margin-inline-start:auto}
      .hero .wrap{grid-template-columns:1fr}
      .hero-photo{order:-1;max-width:640px}
      .facts .wrap{grid-template-columns:1fr 1fr}
      .class-grid{grid-template-columns:1fr}
      .bible{grid-template-columns:1fr}
      .bible .btn{justify-self:start}
      .steps{grid-template-columns:1fr;gap:1.6rem}
      .steps li{padding-top:0;padding-inline-start:4.5rem}
      .split{grid-template-columns:1fr}
      footer .wrap{grid-template-columns:1fr}
    }
    @media (max-width:640px){
      body{font-size:18px}
      .langbar .wrap{width:100%;padding-inline-start:1.25rem;gap:.5rem}
      .lb-label span{display:none}
      .top .wrap{height:68px;gap:.7rem}
      .logo svg{height:34px}
      .lang-btn{padding:.45rem .7rem}
      .top .btn-sm{display:none}
      .tail{width:48px;height:35px}
      .actions .btn{flex:1 1 100%}
      .row,.row.three,.class-pick .opts{grid-template-columns:1fr}
      .row.three.dob-row{grid-template-columns:1.4fr 1fr 1fr}
      dl div{grid-template-columns:1fr;gap:.2rem}
      .bible dl div{grid-template-columns:1fr}
      .facts .wrap{grid-template-columns:1fr 1fr;gap:0 1rem}
      .fact{padding-inline-end:0}
      .form .btn{justify-self:stretch}
    }
  </style>
</head>
<body>
